# Local services (all bound to 127.0.0.1):
# - postgres: the hand-written SQL in sql/ (FL-M1 T11–T12)
# - labelstudio: labeling the gold set (FL-M2 T4–T16)
# Start one: docker compose up -d --wait postgres   (or labelstudio)    Stop: docker compose stop
# Teardown, one service at a time. Never `docker compose down -v`: it would also delete the labels.
# - postgres (rebuild with filinglens.sql.load_postgres):
#     docker compose rm -sf postgres && docker volume rm filinglens_pgdata
# - labelstudio (only after the labels are exported and committed under gold/):
#     docker compose rm -sf labelstudio && docker volume rm filinglens_lsdata
name: filinglens

services:
  postgres:
    image: postgres:18  # stable major; the exact version is recorded in bench/postgres_load.json
    container_name: filinglens-postgres
    environment:
      POSTGRES_DB: filinglens
      POSTGRES_USER: filinglens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"  # localhost only; 55432 avoids any Postgres already on 5432
    volumes:
      - pgdata:/var/lib/postgresql
    # Fixed settings so EXPLAIN ANALYZE timings are reproducible:
    command:
      - postgres
      - -c
      - shared_buffers=1GB  # the marts fit in cache: timings compare plans, not disk reads
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=64MB
      - -c
      - jit=off  # JIT compile time would add noise to every analytic query
      - -c
      - track_io_timing=on  # BUFFERS output shows I/O time
    shm_size: 1gb  # parallel workers use shared memory; Docker's default is 64 MB
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filinglens -d filinglens"]
      interval: 2s
      timeout: 3s
      retries: 30

  labelstudio:
    image: heartexlabs/label-studio:1.23.2  # Apache-2.0; pinned so the labeling UI can't change mid-milestone
    container_name: filinglens-labelstudio
    environment:
      # The admin user and API token are created from these on first start (no UI sign-up).
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:?set LABEL_STUDIO_USERNAME in .env}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:?set LABEL_STUDIO_PASSWORD in .env}
      LABEL_STUDIO_USER_TOKEN: ${LABEL_STUDIO_USER_TOKEN:?set LABEL_STUDIO_USER_TOKEN in .env}
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"  # lets scripts use the fixed token above
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"  # nobody else can create an account
    ports:
      - "127.0.0.1:58080:8080"  # localhost only
    volumes:
      - lsdata:/label-studio/data  # SQLite database with every label: back it up with `export`
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
  lsdata:

# Local services (all bound to 127.0.0.1):
# - postgres: the hand-written SQL in sql/ (FL-M1 T11–T12); pgvector index for retrieval (FL-M3)
# - labelstudio: labeling the gold set (FL-M2 T4–T16)
# - mlflow: experiment tracking + model registry (FL-M4)
# - qdrant: vector store compared with pgvector and FAISS (FL-M3)
# Start one: docker compose up -d --wait postgres   (or labelstudio, mlflow, qdrant)
# Stop: docker compose stop
# Teardown, one service at a time. Never `docker compose down -v`: it would also delete the labels.
# - postgres (rebuild with filinglens.sql.load_postgres):
#     docker compose rm -sf postgres && docker volume rm filinglens_pgdata
# - labelstudio (only after the labels are exported and committed under gold/):
#     docker compose rm -sf labelstudio && docker volume rm filinglens_lsdata
# - mlflow (only after the M4 results are exported to bench/ and docs/):
#     docker compose rm -sf mlflow && docker volume rm filinglens_mlflowdata
# - qdrant (rebuild with filinglens.retrieval.stores):
#     docker compose rm -sf qdrant && docker volume rm filinglens_qdrantdata
name: filinglens

services:
  postgres:
    # The official postgres:18 image (trixie) plus the pgvector extension (PostgreSQL License).
    # Same server build as before (18.7-1.pgdg13+2, checked in FL-M3 T1), so it reuses pgdata
    # as is. Versions in use: bench/postgres_load.json (server), bench/retrieval_env.txt (both).
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: filinglens-postgres
    environment:
      POSTGRES_DB: filinglens
      POSTGRES_USER: filinglens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"  # localhost only; 55432 avoids any Postgres already on 5432
    volumes:
      - pgdata:/var/lib/postgresql
    # Fixed settings so EXPLAIN ANALYZE timings are reproducible:
    command:
      - postgres
      - -c
      - shared_buffers=1GB  # the marts fit in cache: timings compare plans, not disk reads
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=64MB
      - -c
      - jit=off  # JIT compile time would add noise to every analytic query
      - -c
      - track_io_timing=on  # BUFFERS output shows I/O time
    # Parallel workers use shared memory (Docker's default is 64 MB). A parallel HNSW build keeps
    # its graph there too (up to maintenance_work_mem), so FL-M3 raised this from 1gb.
    shm_size: 2gb
    mem_limit: 5g  # was 4g: shared_buffers 1GB + a 1GB HNSW build graph + backends
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filinglens -d filinglens"]
      interval: 2s
      timeout: 3s
      retries: 30

  labelstudio:
    image: heartexlabs/label-studio:1.23.2  # Apache-2.0; pinned so the labeling UI can't change mid-milestone
    container_name: filinglens-labelstudio
    environment:
      # The admin user and API token are created from these on first start (no UI sign-up).
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:?set LABEL_STUDIO_USERNAME in .env}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:?set LABEL_STUDIO_PASSWORD in .env}
      LABEL_STUDIO_USER_TOKEN: ${LABEL_STUDIO_USER_TOKEN:?set LABEL_STUDIO_USER_TOKEN in .env}
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"  # lets scripts use the fixed token above
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"  # nobody else can create an account
    ports:
      - "127.0.0.1:58080:8080"  # localhost only
    volumes:
      - lsdata:/label-studio/data  # SQLite database with every label: back it up with `export`
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 60

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0  # Apache-2.0; same version as the mlflow client in both venvs
    container_name: filinglens-mlflow
    # Comes back when the Docker engine restarts (22 Nov: it stopped mid-training). Doesn't help
    # while Docker Desktop itself is down; the training runs tolerate that (train/tracking.py).
    restart: unless-stopped
    environment:
      # No background job runner: we don't use server jobs (GenAI features); it costs ~GBs of RAM
      # and its endpoints were unauthenticated (CVE-2026-0545).
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0  # inside the container; the port below is published on localhost only
      - --port
      - "5000"
      - --workers
      - "1"  # one user; also keeps memory well under the limit
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db  # runs, params, metrics and the model registry
      - --artifacts-destination
      - /mlflow/artifacts  # adapters, plots; clients upload over HTTP, no shared mount needed
    ports:
      - "127.0.0.1:55000:5000"  # localhost only; MLFLOW_TRACKING_URI=http://127.0.0.1:55000
    volumes:
      - mlflowdata:/mlflow
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.2  # Apache-2.0; version read from the image in FL-M3 T1
    container_name: filinglens-qdrant
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"  # no anonymous usage reports leave the machine
    ports:
      - "127.0.0.1:56333:6333"  # REST, localhost only; QDRANT_URL=http://127.0.0.1:56333
      - "127.0.0.1:56334:6334"  # gRPC, localhost only
    volumes:
      - qdrantdata:/qdrant/storage
    mem_limit: 3g  # 201k x 768 float32 vectors are ~0.6 GB, plus the HNSW graph
    healthcheck:
      # The image has bash but no curl or wget: send the request through bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  lsdata:
  mlflowdata:
  qdrantdata:

[project]
name = "filinglens"
version = "0.1.0"
description = "Answers analyst questions about SEC EDGAR filings with cited numbers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.13.30",
    "dagster-dbt>=0.29.30",
    "dagster-webserver>=1.13.30",
    "dbt-bigquery>=1.11",
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "faiss-cpu>=1.16.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mlflow>=3.18.0",
    "networkx>=3.7",
    "numba>=0.68.1",
    "numpy>=2.5.5",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=26.0.1",
    "pyspark>=4.1,<4.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
api = [
    "fastapi>=0.165.0",
    "onnxruntime>=1.32.0",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
